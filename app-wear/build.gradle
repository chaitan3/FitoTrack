apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    defaultConfig {
        applicationId = 'de.tadris.fitness'
        minSdk = 30
        ///Wear OS, latest is 35
        //noinspection OldTargetApi
        targetSdk = 35
        compileSdk = 36
        versionCode = 1544
        versionName = '16.1'
    }
    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-d"
            resValue("string", "app_name", "FitoTrack (debug)")
        }
        release {
            shrinkResources = true
            minifyEnabled = true
            proguardFiles(
                    getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
            )
        }
    }
    namespace = 'de.tadris.fitness'
    compileOptions{
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    maven { url 'https://jitpack.io' }
}
dependencies {
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.health:health-services-client:1.1.0-alpha05'
    implementation 'androidx.wear.compose:compose-foundation:1.5.1'
    implementation 'androidx.wear.compose:compose-material3:1.5.1'
    implementation 'androidx.wear.compose:compose-navigation:1.5.1'
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.wear:wear-ongoing:1.1.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'//TODO remove after full move to own
    implementation 'com.github.mapsforge.mapsforge:mapsforge-core:0.25.0'
    implementation 'com.github.mapsforge.mapsforge:mapsforge-themes:0.25.0'
    implementation 'com.github.mapsforge.mapsforge:mapsforge-map:0.25.0'
    implementation 'com.github.mapsforge.mapsforge:mapsforge-map-android:0.25.0'
    implementation 'com.google.android.horologist:horologist-compose-layout:0.7.15'//needed for preview somehow
    implementation 'com.google.android.material:material:1.13.0'//TODO remove after full move to material3
    implementation 'com.google.guava:guava:33.4.8-android'
    implementation 'commons-net:commons-net:3.12.0'

    //actually only for debug, but release won't compile without it
    implementation 'androidx.compose.ui:ui-tooling-preview:1.9.1'
    implementation 'androidx.wear:wear-tooling-preview:1.0.0'
}