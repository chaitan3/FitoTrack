apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = 'de.tadris.fitness'
    compileSdk = 36
    defaultConfig {
        applicationId = 'de.tadris.fitness'
        minSdk = 30
        targetSdk = 36
        versionCode = 1544
        versionName = '16.1'
    }
    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-d"
            resValue("string", "app_name", "FitoTrack (debug)")
        }
        release {
            shrinkResources = true
            minifyEnabled = true
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
}

repositories {
    maven { url = 'https://jitpack.io' }
}
dependencies {
    //https://github.com/androidx/androidx
    implementation 'androidx.activity:activity-compose:1.12.3'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.health:health-services-client:1.1.0-alpha05'
    implementation 'androidx.wear.compose:compose-foundation:1.5.6'
    implementation 'androidx.wear.compose:compose-material3:1.5.6'
    implementation 'androidx.wear.compose:compose-navigation:1.5.6'
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.wear:wear-ongoing:1.1.0'
    //https://github.com/mapsforge/mapsforge
    implementation 'com.github.mapsforge.mapsforge:mapsforge-core:0.25.0'
    implementation 'com.github.mapsforge.mapsforge:mapsforge-themes:0.25.0'
    implementation 'com.github.mapsforge.mapsforge:mapsforge-map:0.25.0'
    implementation 'com.github.mapsforge.mapsforge:mapsforge-map-android:0.25.0'
    //https://github.com/google/horologist
    implementation 'com.google.android.horologist:horologist-compose-layout:0.7.15'
    //https://github.com/google/guava
    implementation 'com.google.guava:guava:33.5.0-android'
    //https://github.com/apache/commons-net
    implementation 'commons-net:commons-net:3.12.0'

    //actually only for debug, but release won't compile without it
    //https://github.com/androidx/androidx
    implementation 'androidx.compose.ui:ui-tooling-preview:1.10.2'
    implementation 'androidx.wear:wear-tooling-preview:1.0.0'
}
