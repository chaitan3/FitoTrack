apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    defaultConfig {
        applicationId = 'de.tadris.fitness'
        minSdk = 30
        //latest Wear OS version runs on 34
        //noinspection OldTargetApi
        targetSdk = 34
        compileSdk = 35
        versionCode = 1543
        versionName = '16.0'
    }
    buildTypes {
        release {
            minifyEnabled = false
        }
    }
    namespace = 'de.tadris.fitness'
    compileOptions{
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    maven { url 'https://jitpack.io' }
}
dependencies {
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.health:health-services-client:1.1.0-alpha05'
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.wear:wear-ongoing:1.0.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.github.mapsforge.mapsforge:mapsforge-core:0.23.0'
    implementation 'com.github.mapsforge.mapsforge:mapsforge-themes:0.23.0'
    implementation 'com.github.mapsforge.mapsforge:mapsforge-map:0.23.0'
    implementation 'com.github.mapsforge.mapsforge:mapsforge-map-android:0.23.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.guava:guava:33.3.1-android'
    implementation 'commons-net:commons-net:3.11.1'
}