plugins {
    id('com.android.application')
    id('kotlin-android')
    id('org.jetbrains.kotlin.plugin.compose')
}

allprojects {
    dependencies {
        repositories {
            mavenCentral()
            maven { url 'https://jitpack.io' }
        }
    }
}

android {
    namespace 'de.tadris.fitness'
    compileSdk 36
    defaultConfig {
        applicationId "de.tadris.fitness"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1602
        versionName "16.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix = ".debug"
        }
    }
    buildFeatures {
        compose true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    lint {
        abortOnError false
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE.md', 'META-INF/NOTICE.md', 'META-INF/FastDoubleParser-NOTICE', 'META-INF/thirdparty-LICENSE', 'META-INF/FastDoubleParser-LICENSE']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    // Android
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation "androidx.core:core-ktx:1.17.0"
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // Maps
    def mapsforge_version = "0.25.0"
    implementation "org.mapsforge:mapsforge-core:$mapsforge_version"
    implementation "org.mapsforge:mapsforge-map:$mapsforge_version"
    implementation "org.mapsforge:mapsforge-map-reader:$mapsforge_version"
    implementation "org.mapsforge:mapsforge-themes:$mapsforge_version"
    implementation "org.mapsforge:mapsforge-map-android:$mapsforge_version"
    implementation 'com.caverock:androidsvg:1.4'

    // UI
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.github.clans:fab:1.6.4'

    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2026.03.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // XML
    implementation 'stax:stax-api:1.0.1'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.21.1'
    implementation "tools.jackson.module:jackson-module-kotlin:3.1.0"
    implementation 'net.sf.kxml:kxml2:2.3.0'
    implementation 'xmlpull:xmlpull:1.1.3.1'

    // File Utils

    implementation 'commons-io:commons-io:2.21.0'

    // Upload to OSM
    implementation 'de.westnordost:osmapi-traces:3.2'

    // Parsing date strings in GPX-files
    implementation 'com.github.sisyphsu:dateparser:1.0.11'

    // About Screen
    implementation 'com.github.medyo:android-about-page:1.3'

    // Bluetooth Low Energy (e.g. for heart rate support)
    implementation 'no.nordicsemi.android:ble:2.2.4'
    implementation 'no.nordicsemi.android:ble-common:2.2.4'

    implementation 'org.greenrobot:eventbus:3.3.1'

    // Android Room Database
    def room_version = "2.7.1"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-runtime:$room_version"

    // Android Work Manager
    def work_version = "2.11.1"
    implementation "androidx.work:work-runtime:$work_version"
    implementation "androidx.work:work-runtime-ktx:$work_version"

    // support for the new language APIs
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'com.edmodo:rangebar:1.0.0'


    // New Splash screen API
    implementation 'androidx.core:core-splashscreen:1.2.0'

    // OAuth2.0
    implementation 'com.github.scribejava:scribejava-apis:8.3.3'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'

    configurations {
        all*.exclude group: 'xmlpull', module: 'xmlpull'
    }
}
