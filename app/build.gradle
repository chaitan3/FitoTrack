plugins {
    id('com.android.application')
    id('org.jetbrains.kotlin.plugin.compose')
    id('org.jetbrains.kotlin.plugin.serialization')
}

allprojects {
    dependencies {
        repositories {
            mavenCentral()
            maven { url 'https://jitpack.io' }
        }
    }
}

android {
    namespace 'de.tadris.fitness'
    defaultConfig {
        applicationId "de.tadris.fitness"
        minSdkVersion 26
        compileSdk 37
        targetSdkVersion 37
        versionCode 1620
        versionName "16.2"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix = ".debug"
        }
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    lint {
        abortOnError false
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE.md', 'META-INF/NOTICE.md', 'META-INF/FastDoubleParser-NOTICE', 'META-INF/thirdparty-LICENSE', 'META-INF/FastDoubleParser-LICENSE', 'META-INF/FastDoubleParser-ThirdParty-LICENSE', 'META-INF/Schubfach-LICENSE']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    // Android
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation "androidx.core:core-ktx:1.18.0"
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // Maps
    def mapsforge_version = "0.27.0"
    implementation "com.github.mapsforge.mapsforge:mapsforge-core:$mapsforge_version"
    implementation "com.github.mapsforge.mapsforge:mapsforge-map:$mapsforge_version"
    implementation "com.github.mapsforge.mapsforge:mapsforge-map-reader:$mapsforge_version"
    implementation "com.github.mapsforge.mapsforge:mapsforge-themes:$mapsforge_version"
    implementation "com.github.mapsforge.mapsforge:mapsforge-map-android:$mapsforge_version"
    implementation 'com.caverock:androidsvg:1.4'

    // UI
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'dev.chrisbanes.haze:haze:1.7.2'
    implementation("dev.chrisbanes.haze:haze-materials:1.7.2")

    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2026.05.01')
    implementation composeBom
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.navigation:navigation-compose:2.9.8'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // XML
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.21.4'
    implementation "com.fasterxml.jackson.module:jackson-module-kotlin:2.21.4"
    implementation 'javax.xml.stream:stax-api:1.0-2'

    // File Utils
    implementation 'commons-io:commons-io:2.22.0'

    // Upload to OSM
    implementation 'de.westnordost:osmapi-traces:3.2'
    // OAuth2.0
    implementation 'com.github.scribejava:scribejava-apis:8.3.3'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.1'

    // Parsing date strings in GPX-files (dateparser source inlined in util/dateparser, see NOTICE.md)
    implementation 'com.github.sisyphsu:retree:1.0.4'

    // Bluetooth Low Energy (e.g. for heart rate support)
    implementation 'no.nordicsemi.android:ble:2.2.4'
    implementation 'no.nordicsemi.android:ble-common:2.2.4'

    implementation 'org.greenrobot:eventbus:3.3.1'

    // Pebble Smartwatch
    implementation 'io.rebble.pebblekit2:client:1.1.0'

    // Android Room Database
    def room_version = '2.8.4'
    annotationProcessor "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-runtime:$room_version"

    // Android Work Manager
    def work_version = "2.11.2"
    implementation "androidx.work:work-runtime:$work_version"
    implementation "androidx.work:work-runtime-ktx:$work_version"

    // New Splash screen API
    implementation 'androidx.core:core-splashscreen:1.2.0'

    // support for the new language APIs
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

}

configurations.all {
    // kxml2 and xmlpull bundle org.xmlpull.v1.* which is already built into Android,
    // causing R8 "library class implements program class" errors at build time.
    // stax:stax-api registers com.bea.xml.stream.MXParserFactory via META-INF/services
    // but that class doesn't exist — woodstox (pulled by jackson-dataformat-xml) provides
    // the real StAX factory.
    // Exclude from all configurations except lint, which runs on the JVM and needs them.
    if (!name.toLowerCase().contains('lint')) {
        exclude group: 'xmlpull', module: 'xmlpull'
        exclude group: 'net.sf.kxml', module: 'kxml2'
        exclude group: 'stax', module: 'stax-api'
    }
}
